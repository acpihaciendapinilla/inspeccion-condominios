<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Inspección de Condominios</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspección HP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Mismo sistema visual que Inspección Master Easement: blanco, olivo y dorado, una columna pensada para el celular. */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f7f7f0;
  --line:#e3e3d4;
  --ink:#2f2f0e;
  --muted:#6b6b52;
  --olive:#9a9a54;
  --olive-dark:#6f6f33;
  --olive-soft:#eeeedd;
  --ok:#3f7a3a; --ok-bg:#e7f1e3;
  --bad:#a46a12; --bad-bg:#fbefd9;
  --urg:#b3261e; --urg-bg:#fbe4e1;
  --na:#6b6b6b; --na-bg:#eeeeee;
  --navy:#1f2d4a;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 140px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.h2{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1}

/* Barra superior */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:12px;min-height:56px}
.top-in img{height:26px;width:auto}
.top-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--olive-dark);font-weight:600;padding:8px 4px}

/* Inicio */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding-top:28px}
.home>img{width:min(280px,80%)}
.home h1{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1}
.stack{display:flex;flex-direction:column;gap:12px;width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r);border:1px solid var(--olive-dark);background:var(--olive-dark);color:#fff;font-weight:600;font-size:17px;padding:12px 16px}
.btn.sec{background:var(--bg);color:var(--olive-dark)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500;min-height:44px;font-size:15px}
.btn.danger{background:var(--urg);border-color:var(--urg)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.resume{width:100%;text-align:left;background:var(--olive-soft);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.resume img{width:64px;height:44px;object-fit:contain;mix-blend-mode:multiply;flex:none}
.resume div{display:flex;flex-direction:column;gap:2px;min-width:0}

/* Formularios */
label.f{display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:600}
input[type=text],textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.block{display:flex;flex-direction:column;gap:10px;padding-top:18px}
.block>h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive-dark)}

/* Administradores */
.admins{display:flex;flex-direction:column;gap:8px}
.adm{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:10px 14px;font-weight:600;text-align:left}
.adm .sel{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
.adm[aria-pressed=true]{border:2px solid var(--olive-dark);background:var(--olive-soft);padding:9px 13px}
.adm[aria-pressed=true] .sel{background:var(--olive-dark);border-color:var(--olive-dark)}

/* Tarjetas de condominios */
.condos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ccard{min-height:118px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative}
.ccard img{width:100%;height:62px;object-fit:contain;mix-blend-mode:multiply}
.ccard span{font-size:14px;font-weight:600;line-height:1.2;text-align:center}
.ccard[aria-pressed=true]{border:2px solid var(--olive-dark);background:var(--olive-soft);padding:9px}
.ccard[aria-pressed=true]::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--olive-dark);color:#fff;font-size:13px;display:grid;place-items:center}

/* Encabezado de la inspección */
.ihead{display:flex;gap:14px;align-items:center;padding-block:8px 14px}
.ihead img{width:84px;height:60px;object-fit:contain;flex:none}
.ihead h2{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.05}
.summary{display:flex;flex-direction:column;gap:8px;padding-bottom:16px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--olive);border-radius:99px;transition:width .3s}

/* Secciones */
.secs{display:flex;flex-direction:column;gap:8px}
.scard{display:flex;align-items:center;gap:12px;text-align:left;min-height:64px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:12px 14px}
.scard .num{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.scard.done{border-color:var(--olive)}
.scard.done .num{background:var(--olive);border-color:var(--olive);color:#fff}
.scard .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.scard strong{font-size:16px;line-height:1.2}
.scard .chev{color:var(--olive-dark);font-size:22px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:99px;padding:3px 10px;width:fit-content}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.urg{background:var(--urg-bg);color:var(--urg)}
.pill.na{background:var(--na-bg);color:var(--na)}
.pill.prog{background:var(--olive-soft);color:var(--olive-dark)}
.pills{display:flex;gap:6px;flex-wrap:wrap}

/* Puntos */
.sec-head{display:flex;flex-direction:column;gap:6px;padding-block:6px 14px}
.sec-head h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.item.complete{border-color:var(--olive)}
.item-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.item-name{font-weight:600;font-size:17px;line-height:1.25}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:14px}
.item.complete .check{background:var(--olive);border-color:var(--olive)}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;padding:4px 2px;line-height:1.15}
.st[aria-pressed=true].ok{background:var(--ok);border-color:var(--ok);color:#fff}
.st[aria-pressed=true].bad{background:var(--bad);border-color:var(--bad);color:#fff}
.st[aria-pressed=true].urg{background:var(--urg);border-color:var(--urg);color:#fff}
.st[aria-pressed=true].na{background:var(--na);border-color:var(--na);color:#fff}
.extra{display:flex;flex-direction:column;gap:10px}
.req{font-size:13px;color:var(--urg);font-weight:600}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.addph{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--olive);background:var(--olive-soft);color:var(--olive-dark);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;text-align:center}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600}
.yn button[aria-pressed=true]{background:var(--olive-dark);border-color:var(--olive-dark);color:#fff}
.hint{font-size:13px;color:var(--muted);font-weight:400}

/* Barra inferior fija */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column;gap:8px}
.foot-note{font-size:14px;color:var(--muted);text-align:center}
.confirm{background:var(--olive-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Firma y final */
.stats{width:100%;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);text-align:center}
.stats div{padding:12px 4px;display:flex;flex-direction:column;gap:2px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
.sigbox{width:100%;min-height:140px;border:1.5px dashed var(--olive);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--olive-dark);font-weight:600;padding:12px}
.sigbox.signed{border-style:solid;background:#fff}
.sigbox img{width:100%;max-height:120px;object-fit:contain}
.final{display:flex;flex-direction:column;gap:18px;text-align:center;align-items:center;padding-top:24px}
.seal{width:76px;height:76px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font-size:38px}
.final h2{font-family:var(--display);font-size:32px;font-weight:600}
.thanks{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 10px 6px;border-top:1px solid var(--line);width:100%}
.thanks img{width:150px}
.thanks p{font-family:var(--display);font-size:22px;line-height:1.35;color:var(--navy);font-weight:500}
.thanks b{font-family:var(--display);font-size:20px;letter-spacing:.06em;color:#6b7f5a;font-weight:500}
.tip{font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);text-align:left;width:100%}

/* Historial */
.hist-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:4px}
.link{border:0;background:none;color:var(--olive-dark);font-weight:600;padding:6px 0;font-size:15px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{padding-block:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hist-top{display:flex;gap:12px;align-items:center}
.hist-top img{width:56px;height:40px;object-fit:contain;flex:none}
.hist-top div{flex:1;min-width:0;display:flex;flex-direction:column}
.hist .btn{min-height:44px;font-size:15px}
.empty{text-align:center;padding:40px 8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}

/* Firma en pantalla completa (horizontal) */
.sig{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:hidden;touch-action:none;overscroll-behavior:none}
.sig-stage{position:absolute;top:0;left:0;transform-origin:0 0;display:flex;flex-direction:column;padding:12px 16px;gap:10px}
.sig-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sig-head strong{font-family:var(--display);font-size:22px;font-weight:600}
.sig-pad{position:relative;flex:1;min-height:0;border:1.5px solid var(--line);border-radius:var(--r);background:#fff}
.sig-pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.sig-line{position:absolute;left:8%;right:8%;bottom:26%;border-bottom:1.5px solid var(--olive);pointer-events:none}
.sig-x{position:absolute;left:8%;bottom:calc(26% + 6px);color:var(--olive-dark);font-size:20px;pointer-events:none}
.sig-hint{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:14px;color:var(--muted);pointer-events:none}
.sig-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sig-actions .btn{min-height:50px}
.sig-turn{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =========================================================
   CONFIGURACIÓN
   Las personas, condominios y puntos NO se editan aquí:
   están en el archivo configuracion.json (y los logos en la carpeta logos/).
   Ver AGENTS.md.
   ========================================================= */
const HP = {logo:"logos/hacienda-pinilla.jpg", data:null, w:700, h:217};  // logo de Hacienda Pinilla
let PERSONAS = [];     // [{nombre, cargo}]
let CONDOMINIOS = [];  // [{id, nombre, logo}]
let SECCIONES = [];    // [{id, nombre, puntos:[{id, nombre}]}]

function validarConfig(cfg){
  const err=[];
  if(!cfg || typeof cfg!=="object") return ["El archivo no tiene el formato esperado"];
  const lista=(k)=>Array.isArray(cfg[k])&&cfg[k].length?cfg[k]:(err.push(`Falta la lista "${k}"`),[]);
  lista("personas").forEach((p,i)=>{ if(!p||!String(p.nombre||"").trim()) err.push(`Persona ${i+1} sin nombre`); if(!p||!String(p.cargo||"").trim()) err.push(`Persona ${i+1} sin cargo`); });
  const ids=new Set();
  const unico=(id,que)=>{ if(!id||typeof id!=="string") err.push(`${que} sin id`); else if(ids.has(id)) err.push(`id repetido: ${id}`); else ids.add(id); };
  lista("condominios").forEach((c,i)=>{ unico(c&&c.id,`Condominio ${i+1}`); if(!c||!String(c.nombre||"").trim()) err.push(`Condominio ${i+1} sin nombre`); });
  lista("apartados").forEach((a,i)=>{ unico(a&&a.id,`Apartado ${i+1}`); if(!a||!String(a.nombre||"").trim()) err.push(`Apartado ${i+1} sin nombre`);
    if(!a||!Array.isArray(a.puntos)||!a.puntos.length) err.push(`Apartado ${i+1} sin puntos`);
    else a.puntos.forEach((p,j)=>{ unico(p&&p.id,`Punto ${j+1} de ${a.nombre}`); if(!p||!String(p.nombre||"").trim()) err.push(`Punto ${j+1} de ${a.nombre} sin nombre`); }); });
  return err;
}
function aplicarConfig(cfg){
  PERSONAS = cfg.personas.map(p=>({nombre:String(p.nombre).trim(), cargo:String(p.cargo).trim()}));
  CONDOMINIOS = cfg.condominios.map(c=>({id:c.id, nombre:String(c.nombre).trim(), logo:c.logo?String(c.logo):""}));
  SECCIONES = cfg.apartados.map(a=>({id:a.id, nombre:String(a.nombre).trim(), puntos:a.puntos.map(p=>({id:p.id, nombre:String(p.nombre).trim()}))}));
}
async function cargarConfig(){
  // 1) la versión más nueva de internet; 2) la última buena guardada en el teléfono
  let aviso=null;
  try{
    const r=await fetch("configuracion.json",{cache:"no-store"});
    if(r.ok){
      let cfg=null; try{ cfg=await r.json(); }catch(e){ cfg=null; }
      const err=validarConfig(cfg);
      if(!err.length){ aplicarConfig(cfg); LS.set("config",JSON.stringify(cfg)); return true; }
      console.warn("configuracion.json con errores:",err); aviso="La configuración nueva tiene un error. Se usa la anterior.";
    }
  }catch(e){ console.warn("No se pudo leer configuracion.json",e); }
  try{ const cfg=JSON.parse(LS.get("config")||"null"); if(cfg && !validarConfig(cfg).length){ aplicarConfig(cfg); if(aviso) setTimeout(()=>toast(aviso),600); return true; } }catch(e){}
  return false;
}
// Convierte una imagen de la carpeta logos/ en datos para el PDF
const IMG_CACHE={};
async function imgDatos(src){
  if(!src) return null;
  if(src.startsWith("data:")){ return await medir(src); }
  if(IMG_CACHE[src]) return IMG_CACHE[src];
  try{
    const r=await fetch(src); if(!r.ok) return null;
    const blob=await r.blob();
    const url=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
    // se pasa a JPEG con fondo blanco para que el PDF lo acepte siempre (PNG, JPG o WEBP)
    const out=await new Promise((res)=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,700/Math.max(im.naturalWidth,im.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res({data:c.toDataURL("image/jpeg",0.9), w:c.width, h:c.height}); }; im.onerror=()=>res(null); im.src=url; });
    if(out) IMG_CACHE[src]=out; return out;
  }catch(e){ return null; }
}
function medir(data){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res({data, w:im.naturalWidth, h:im.naturalHeight}); im.onerror=()=>res(null); im.src=data; }); }

const ESTADOS = {
  bueno:   {txt:"Bueno",     cls:"ok",  pdf:[63,122,58]},
  malo:    {txt:"Malo",      cls:"bad", pdf:[164,106,18]},
  urgente: {txt:"Urgente",   cls:"urg", pdf:[179,38,30]},
  na:      {txt:"No aplica", cls:"na",  pdf:[107,107,107]}
};
const NECESITA_EVIDENCIA = e => e==="malo" || e==="urgente";
const MAX_FOTOS = 3;           // por punto
const MAX_FOTOS_GENERAL = 5;   // evidencia fotográfica general
const MENSAJE_FINAL = "Tu labor garantiza que cada rincón de nuestra Hacienda se mantenga en condiciones óptimas. ¡Gracias por tu compromiso con la excelencia!";

/* ===================== Almacenamiento (en el celular) ===================== */
const DB = (() => {
  let dbp = null; const mem = {};
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try{
        const r = indexedDB.open("inspeccion-condominios", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  async function get(k){
    const db = await open(); if(!db) return mem[k];
    return new Promise(res => { try{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(mem[k]); }catch(e){res(mem[k]);} });
  }
  async function set(k,v){
    mem[k]=v; const db = await open(); if(!db) return;
    return new Promise(res => { try{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res();} });
  }
  async function del(k){
    delete mem[k]; const db = await open(); if(!db) return;
    return new Promise(res => { try{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res();} });
  }
  return {get,set,del};
})();
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

const pad = n => String(n).padStart(2,"0");
const hoyISO = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const hora = iso => { if(!iso) return "--:--"; const d=new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const fechaLarga = f => { const [y,m,d]=f.split("-").map(Number); const t=new Date(y,m-1,d).toLocaleDateString("es-CR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); return t.charAt(0).toUpperCase()+t.slice(1); };
const fechaCorta = f => { const [y,m,d]=f.split("-"); return d+"/"+m+"/"+y; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const logoDe = cd => cd.data || cd.logo || "";
const secsDe = rec => (rec && rec.secciones) || SECCIONES;
const todosDe = rec => secsDe(rec).flatMap(s => s.puntos.map(p => ({...p, sec:s})));
const cargoDe = rec => rec.cargo || (PERSONAS.find(p=>p.nombre===rec.admin)||{}).cargo || "COA Coordinator";

function nuevaInspeccion(persona, condo, logo){
  // Se guarda una copia de la configuración: si mañana cambia, esta inspección y su PDF no cambian.
  return {id:"i"+Date.now(), admin:persona.nombre, cargo:persona.cargo, condo:condo.id,
    condoInfo:{id:condo.id, nombre:condo.nombre, logo:condo.logo, data:logo?logo.data:null, w:logo?logo.w:1, h:logo?logo.h:1},
    secciones:JSON.parse(JSON.stringify(SECCIONES)), fecha:hoyISO(), creado:new Date().toISOString(), inicio:null, fin:null,
    items:{}, cierre:{hallazgos:[],fotos:[],proveedor:null,proveedores:""},
    firma:null, cerrado:false, compartido:null};
}
function itemCompleto(d){
  if(!d || !d.estado) return false;
  if(NECESITA_EVIDENCIA(d.estado)) return (d.comentario||"").trim().length>0 && (d.fotos||[]).length>0;
  return true;
}
const cierreCompleto = rec => rec.cierre.proveedor==="no" || (rec.cierre.proveedor==="si" && rec.cierre.proveedores.trim().length>0);
function avanceSec(s, rec=I){ const hechos=s.puntos.filter(p=>itemCompleto(rec.items[p.id])).length; return {hechos, n:s.puntos.length}; }
function avanceTotal(rec=I){
  const T=todosDe(rec);
  const hechos = T.filter(p=>itemCompleto(rec.items[p.id])).length + (cierreCompleto(rec)?1:0);
  return {hechos, n:T.length+1};
}
function conteos(rec){
  const c={bueno:0,malo:0,urgente:0,na:0,total:0};
  todosDe(rec).forEach(p=>{ const d=rec.items[p.id]; if(d&&d.estado){ c[d.estado]++; c.total++; } });
  return c;
}

  const p=s.puntos.find(x=>x.id===pid);

    const pid=b.dataset.it; const d=(I.items[pid] ||= {fotos:[],comentario:""});

  $app.querySelectorAll("[data-c]").forEach(t=>t.oninput=()=>{

  $app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{

    const n=document.getElementById("h-t-"+(I.cierre.hallazgos.length-1)); if(n) n.focus();
  };

  const gi=$app.querySelector("[data-ph]"); if(gi) gi.onchange=async()=>{

    catch(e){ toast("No se pudo leer la foto. Intenta de nuevo."); }
  };
  $app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ I.cierre.fotos.splice(Number(b.dataset.i),1); guardar(); const y=scrollY; vCierre(); scrollTo(0,y); });

/* ---------- Fotos: reducir tamaño antes de guardar ---------- */
function comprimir(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        const max=1280; let w=img.naturalWidth, h=img.naturalHeight;
        const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res({src:c.toDataURL("image/jpeg",0.72), w, h, hora:new Date().toISOString()});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- Firma con el dedo, en horizontal ---------- */
const SIG = {strokes:[], cur:null};
const $sig=document.getElementById("sig"), $stage=document.getElementById("sigStage"), $cv=document.getElementById("sigCanvas");
function vertical(){ return innerHeight>innerWidth; }
function layoutFirma(){
  const vw=innerWidth, vh=innerHeight;
  if(vertical()){
    $stage.style.width=vh+"px"; $stage.style.height=vw+"px";
    $stage.style.transform=`translate(${vw}px,0) rotate(90deg)`;
    document.getElementById("sigTurn").textContent="Gira el teléfono para firmar más cómodo";
  }else{
    $stage.style.width=vw+"px"; $stage.style.height=vh+"px"; $stage.style.transform="none";
    document.getElementById("sigTurn").textContent="";
  }
  const dpr=window.devicePixelRatio||1;
  $cv.width=Math.round($cv.offsetWidth*dpr); $cv.height=Math.round($cv.offsetHeight*dpr);
  dibujarFirma();
}
function dibujarFirma(){
  const ctx=$cv.getContext("2d"); const w=$cv.width, h=$cv.height;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#1f2a14"; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=Math.max(2.2,h*0.012);
  SIG.strokes.forEach(st=>{
    ctx.beginPath();
    st.forEach((pt,i)=>{ const x=pt[0]*w, y=pt[1]*h; if(i===0){ ctx.moveTo(x,y); ctx.lineTo(x+0.01,y+0.01); } else ctx.lineTo(x,y); });
    ctx.stroke();
  });
  const vacio=!SIG.strokes.length;
  document.getElementById("sigOk").disabled=vacio;
  document.getElementById("sigHint").hidden=!vacio;
}
function puntoFirma(e){
  const r=$cv.getBoundingClientRect(); const w=$cv.offsetWidth, h=$cv.offsetHeight;
  let x,y;
  if(vertical()){ x=e.clientY-r.top; y=r.right-e.clientX; } else { x=e.clientX-r.left; y=e.clientY-r.top; }
  return [Math.min(1,Math.max(0,x/w)), Math.min(1,Math.max(0,y/h))];
}
$cv.addEventListener("pointerdown",e=>{ e.preventDefault(); try{$cv.setPointerCapture(e.pointerId);}catch(_){} SIG.cur=[puntoFirma(e)]; SIG.strokes.push(SIG.cur); dibujarFirma(); });
$cv.addEventListener("pointermove",e=>{ if(!SIG.cur) return; e.preventDefault(); SIG.cur.push(puntoFirma(e)); dibujarFirma(); });
["pointerup","pointercancel","pointerleave"].forEach(t=>$cv.addEventListener(t,()=>{ SIG.cur=null; }));
async function abrirFirma(){
  SIG.strokes=[]; SIG.cur=null;
  document.getElementById("sigName").textContent="Firma de "+I.admin;
  $sig.hidden=false; document.body.style.overflow="hidden";
  try{ if(document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen(); }catch(e){}
  try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); }catch(e){}
  layoutFirma(); setTimeout(layoutFirma,350);
}
async function cerrarFirma(){
  $sig.hidden=true; document.body.style.overflow="";
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  try{ if(document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen(); }catch(e){}
}
function exportarFirma(){
  // Recorta al área firmada y la guarda como imagen con fondo blanco
  const W=1200, H=450; const c=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  const pts=SIG.strokes.flat(); let x0=Math.min(...pts.map(p=>p[0])), x1=Math.max(...pts.map(p=>p[0])), y0=Math.min(...pts.map(p=>p[1])), y1=Math.max(...pts.map(p=>p[1]));
  const aspect=$cv.offsetWidth/$cv.offsetHeight; // ancho real / alto real
  let bw=Math.max(x1-x0,0.02)*aspect, bh=Math.max(y1-y0,0.02);
  const k=Math.min((W*0.92)/bw,(H*0.86)/bh);
  const ox=(W-bw*k)/2, oy=(H-bh*k)/2;
  ctx.strokeStyle="#1f2a14"; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=7;
  SIG.strokes.forEach(st=>{ ctx.beginPath(); st.forEach((p,i)=>{ const x=ox+(p[0]-x0)*aspect*k, y=oy+(p[1]-y0)*k; if(i===0){ctx.moveTo(x,y);ctx.lineTo(x+.5,y+.5);} else ctx.lineTo(x,y); }); ctx.stroke(); });
  return c.toDataURL("image/png");
}
document.getElementById("sigRedo").onclick=()=>{ SIG.strokes=[]; dibujarFirma(); };
document.getElementById("sigCancel").onclick=()=>cerrarFirma();
document.getElementById("sigOk").onclick=async()=>{
  if(!SIG.strokes.length) return;
  I.firma=exportarFirma(); I.firmado=new Date().toISOString(); guardar();
  await cerrarFirma(); vFirma(); toast("Firma guardada");
};
addEventListener("resize",()=>{ if(!$sig.hidden) layoutFirma(); });

/* ===================== PDF ===================== */
function construirPDF(rec, cd, hp){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, M=15, CW=W-2*M, H=297; let y=M;
  const INK=[47,47,14], MUTED=[107,107,82], OLIVE=[154,154,84], OLIVED=[111,111,51], LINE=[227,227,212], SOFT=[238,238,221];
  const nueva=()=>{ doc.addPage(); y=M; };
  const espacio=h=>{ if(y+h>H-18) nueva(); };
  const c=conteos(rec); const cargo=cargoDe(rec);
  const titulo=(t)=>{ espacio(14); doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(...OLIVED); doc.text(t,M,y); y+=2; doc.setDrawColor(...OLIVE); doc.setLineWidth(0.4); doc.line(M,y,W-M,y); y+=6; };
  const pill=(e,xr,yy)=>{ doc.setFontSize(8.5); doc.setFont("helvetica","bold"); const tw=doc.getTextWidth(e.txt)+6; doc.setFillColor(...e.pdf); doc.roundedRect(xr-tw,yy-4.6,tw,6.2,1.8,1.8,"F"); doc.setTextColor(255,255,255); doc.text(e.txt,xr-tw/2,yy-0.3,{align:"center"}); };

  // Encabezado
  try{ if(hp) doc.addImage(hp.data,"JPEG",M,y,46,46*hp.h/hp.w); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(...INK);
  doc.text("Inspección de Condominio", W-M, y+6, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...MUTED);
  const fl=fechaLarga(rec.fecha); doc.text(fl.charAt(0).toUpperCase()+fl.slice(1), W-M, y+12, {align:"right"});
  y+=20; doc.setDrawColor(...OLIVE); doc.setLineWidth(0.6); doc.line(M,y,W-M,y); y+=6;

  // Condominio y datos
  const lh=22, lw=cd.data?Math.min(48, lh*cd.w/cd.h):0;
  try{ if(cd.data) doc.addImage(cd.data,"JPEG",M,y,lw,lw*cd.h/cd.w); }catch(e){}
  const dx=lw?M+56:M; const datos=[["Condominio",cd.nombre],["Inspeccionó",rec.admin],["Cargo",cargo],["Fecha",fechaCorta(rec.fecha)],["Horario",`${hora(rec.inicio)} – ${hora(rec.fin)}`]];
  doc.setFontSize(10);
  datos.forEach((d,i)=>{ const yy=y+4+i*5.6; doc.setTextColor(...MUTED); doc.setFont("helvetica","normal"); doc.text(d[0]+":",dx,yy); doc.setTextColor(...INK); doc.setFont("helvetica","bold"); doc.text(String(d[1]),dx+34,yy); });
  y+=Math.max(lw?lw*cd.h/cd.w:0, 30)+4;

  // Resumen de estados
  const bw=(CW-9)/4;
  Object.entries(ESTADOS).forEach(([k,e],i)=>{ const x=M+i*(bw+3);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.roundedRect(x,y,bw,16,2,2,"S");
    doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(...e.pdf); doc.text(String(c[k]),x+bw/2,y+8,{align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text(e.txt,x+bw/2,y+13,{align:"center"}); });
  y+=24;

  // Puntos que requieren atención (con fotos)
  const atencion=todosDe(rec).filter(p=>NECESITA_EVIDENCIA(rec.items[p.id]?.estado))
    .sort((a,b)=>(rec.items[a.id].estado==="urgente"?0:1)-(rec.items[b.id].estado==="urgente"?0:1));
  if(atencion.length){
    titulo("Puntos que requieren atención");
    atencion.forEach(p=>{
      const d=rec.items[p.id]; const e=ESTADOS[d.estado];
      const coment=d.comentario?doc.splitTextToSize(d.comentario,CW-4):[];
      const fotos=d.fotos||[];
      espacio(12+coment.length*4.5+(fotos.length?44:0));
      doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text(p.sec.nombre,M,y);
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...INK); doc.text(p.nombre,M,y+5);
      pill(e,W-M,y+4.5); y+=9;
      if(coment.length){ doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(coment,M+2,y+1); y+=coment.length*4.5+2; }
      if(fotos.length){ let fx=M; const bh=38;
        fotos.forEach(f=>{ const fw=Math.min(56,bh*f.w/f.h), fh=fw*f.h/f.w; try{ doc.addImage(f.src,"JPEG",fx,y,fw,fh); }catch(err){} fx+=fw+4; });
        y+=bh+4; }
      doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(M,y,W-M,y); y+=6;
    });
    y+=2;
  }

  // Detalle de todos los puntos
  titulo("Detalle de la inspección");
  secsDe(rec).forEach(s=>{
    espacio(16);
    doc.setFillColor(...SOFT); doc.rect(M,y-4.5,CW,7,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...OLIVED); doc.text(s.nombre.toUpperCase(),M+2,y);
    y+=6;
    s.puntos.forEach(p=>{
      const d=rec.items[p.id]||{}; const e=ESTADOS[d.estado];
      const coment=(d.comentario&&!NECESITA_EVIDENCIA(d.estado))?doc.splitTextToSize(d.comentario,CW-40):[];
      espacio(7+coment.length*4);
      doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...INK); doc.text(p.nombre,M+2,y+1);
      if(e) pill(e,W-M,y+1.6);
      y+=6;
      if(coment.length){ doc.setFontSize(8.8); doc.setTextColor(...MUTED); doc.text(coment,M+4,y); y+=coment.length*4; }
      doc.setDrawColor(...LINE); doc.setLineWidth(0.15); doc.line(M,y-1.5,W-M,y-1.5); y+=2;
    });
    y+=3;
  });

  // Hallazgos y seguimiento
  titulo("Hallazgos y seguimiento");
  const ci=rec.cierre;
  const hs=hallazgosLlenos(rec);
  const bloques=[...(hs.length?hs.map((h,i)=>[(h.titulo||"").trim()||`Hallazgo ${i+1}`, (h.descripcion||"").trim()]):[["Hallazgos","Sin hallazgos registrados"]]),
    ["¿Se crearon casos de seguimiento a proveedor?", ci.proveedor==="si"?"Sí":"No"]];
  if(ci.proveedor==="si") bloques.push(["Proveedor(es)", ci.proveedores.trim()]);
  bloques.forEach(([t,v])=>{
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); const tl=doc.splitTextToSize(t,CW-2);
    doc.setFont("helvetica","normal"); doc.setFontSize(10); const lines=v?doc.splitTextToSize(v,CW-2):[];
    espacio(4+tl.length*4.6+lines.length*4.6+3);
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...OLIVED); doc.text(tl,M,y); y+=tl.length*4.6;
    if(lines.length){ doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...(v==="Sin hallazgos registrados"?MUTED:INK)); doc.text(lines,M,y+0.4); y+=lines.length*4.6; }
    y+=3;
  });

  // Evidencia fotográfica general
  if(ci.fotos.length){
    titulo("Evidencia fotográfica");
    const fw=(CW-6)/2;
    for(let i=0;i<ci.fotos.length;i+=2){
      const fila=ci.fotos.slice(i,i+2); const fh=Math.min(66, Math.max(...fila.map(f=>fw*f.h/f.w)));
      espacio(fh+6);
      fila.forEach((f,j)=>{ let w=fw, h=fw*f.h/f.w; if(h>fh){ h=fh; w=fh*f.w/f.h; }
        try{ doc.addImage(f.src,"JPEG",M+j*(fw+6)+(fw-w)/2,y,w,h); }catch(e){} });
      y+=fh+6;
    }
  }

  // Firma
  espacio(46); y+=6;
  const sx=W/2-40;
  try{ if(rec.firma) doc.addImage(rec.firma,"PNG",sx+5,y,70,26); }catch(e){}
  y+=28; doc.setDrawColor(...INK); doc.setLineWidth(0.4); doc.line(sx,y,sx+80,y); y+=5;
  doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...INK); doc.text(rec.admin,W/2,y,{align:"center"}); y+=5;
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...MUTED);
  doc.text(`${cargo} · ${cd.nombre} · Firmado el ${fechaCorta(rec.fecha)} a las ${hora(rec.firmado||rec.fin)}`,W/2,y,{align:"center"}); y+=12;

  // Pie de página
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text(`Hacienda Pinilla · Inspección ${cd.nombre} · ${fechaCorta(rec.fecha)} · ${rec.admin}`,M,H-8);
    doc.text(`Página ${i} de ${n}`,W-M,H-8,{align:"right"}); }
  return doc;
}
function nombreArchivo(rec){
  const limpio=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"");
  return `Inspeccion_${limpio(condoDe(rec).nombre)}_${rec.fecha}.pdf`;
}
async function compartirPDF(rec, btn){
  if(!window.jspdf){ toast("No se pudo cargar el generador de PDF. Revisa la señal y recarga."); return; }
  const txt=btn.textContent; btn.disabled=true; btn.textContent="Generando PDF…";
  try{
    const cd={...condoDe(rec)};
    if(!cd.data){ const l=await imgDatos(cd.logo); if(l) Object.assign(cd,l); }
    const hp=await imgDatos(HP.logo);
    const doc=construirPDF(rec, cd, hp);
    const nombre=nombreArchivo(rec);
    const blob=doc.output("blob");
    const c=conteos(rec);
    const resumen=`Inspección ${cd.nombre} · ${fechaCorta(rec.fecha)} · ${rec.admin}`+(c.urgente||c.malo?` · ${c.urgente} urgente, ${c.malo} malo`:" · todo en buen estado");
    let hecho=false, enviado=false;
    // 1) Teléfono: menú de compartir (Slack, WhatsApp, correo…)
    if(navigator.canShare){
      try{ const file=new File([blob],nombre,{type:"application/pdf"});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:resumen,text:resumen}); hecho=true; enviado=true; } }
      catch(e){ if(e&&e.name==="AbortError") hecho=true; }
    }
    // 2) Computadora: descarga directa
    if(!hecho){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("PDF descargado"); enviado=true; }
    if(enviado){
      rec.compartido=new Date().toISOString();
      const h=HIST.find(x=>x.id===rec.id); if(h) h.compartido=rec.compartido;
      await DB.set("historial",HIST); if(I && I.id===rec.id) await DB.set("actual",I);
      if(view.name==="hist") vHist();
    }
  }catch(e){ console.error(e); toast("No se pudo generar el PDF. Intenta de nuevo."); }
  finally{ if(btn.isConnected){ btn.disabled=false; btn.textContent=txt; } }
}

/* ===================== Arranque ===================== */
(async function(){
  CONFIG_OK = await cargarConfig();
  render();
  try{
    const [act,hist]=await Promise.all([DB.get("actual"),DB.get("historial")]);
    HIST=Array.isArray(hist)?hist:[];
    if(act && act.items){ I=act; if(I.cerrado){ I=null; await DB.del("actual"); } }
  }catch(e){}
  render();
  if("serviceWorker" in navigator && location.protocol==="https:"){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
})();
